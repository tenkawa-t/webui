name: Android Build (english-learning app)

on:
  push:
    branches:
      - "claude/english-learning-android-app-lv0jno"
    paths:
      - "android-english-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-english-app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-english-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-english-app/app/build/outputs/apk/debug/app-debug.apk
